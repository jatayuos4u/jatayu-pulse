name: Build and publish Jatayu Pulse
on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
    steps:
      - name: Install Debian 13 build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build \
            qt6-base-dev libkf6coreaddons-dev libkf6i18n-dev \
            dpkg-dev libgl1-mesa-dev libxkbcommon-dev

      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build and run unit tests
        env:
          JATAYU_MAINTAINER_EMAIL: contact@jatayuos.in
        run: |
          bash packaging/build-deb.sh
          dpkg-deb --info ./*.deb
          sha256sum ./*.deb > SHA256SUMS

      - name: Upload validated package as build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jatayu-debian-package
          path: |
            jatayu-system-monitor_*.deb
            SHA256SUMS
          if-no-files-found: error

  publish-release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jatayu-debian-package

      - name: Confirm package matches tag
        shell: bash
        run: |
          set -euo pipefail
          package=(jatayu-system-monitor_*.deb)
          test "${#package[@]}" -eq 1
          actual="$(dpkg-deb -f "${package[0]}" Version)"
          test "v${actual%%-*}" = "${GITHUB_REF_NAME}"
          sha256sum --check SHA256SUMS

      - name: Publish GitHub stable release
        uses: softprops/action-gh-release@v2
        with:
          name: Jatayu Pulse ${{ github.ref_name }} Stable
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            jatayu-system-monitor_*.deb
            SHA256SUMS
